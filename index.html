<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan TKA — Siap Tes Kemampuan Akademik</title>
    <meta
      name="description"
      content="Website latihan soal Tes Kemampuan Akademik (TKA). Kerjakan per paket, mode latihan dengan pembahasan atau mode ujian dengan nilai akhir."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Inisialisasi tema tanpa flicker: ikut simpanan atau preferensi sistem.
      (function () {
        var t = localStorage.getItem("tka-theme");
        if (!t)
          t = window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
        document.documentElement.classList.toggle("dark", t === "dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
